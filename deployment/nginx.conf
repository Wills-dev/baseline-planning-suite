server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime JSON is mounted separately from the compiled bundles.
    location = /remote-config.json {
        alias /etc/baseline-runtime/shell.json;
        add_header Cache-Control "no-store" always;
    }
    location = /delivery/remote-config.json {
        alias /etc/baseline-runtime/delivery.json;
        add_header Cache-Control "no-store" always;
    }

    location = /people { return 301 /people/; }
    location = /delivery { return 301 /delivery/; }

    # Never serve a SPA index for a missing entry, chunk, stylesheet, or JSON file.
    location ~ /remoteEntry\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(people/|delivery/)?assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(js|mjs|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /people/ {
        try_files $uri $uri/ /people/index.html;
        add_header Cache-Control "no-cache";
    }
    location /delivery/ {
        try_files $uri $uri/ /delivery/index.html;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
